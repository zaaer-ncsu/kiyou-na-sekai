        <blockquote>
          <p class="main">
            私はマリーミー・パスタ <br>
            <ruby>舌<rt>した</rt></ruby>を<ruby>包<rt>つつ</rt></ruby>む、忘れられない味 <br>
            <ruby>心臓<rt>しんぞう</rt></ruby>に悪いけど、心に<ruby>優<rt>やさ</rt></ruby>しい <br>
            心を<ruby>包<rt>つつ</rt></ruby>む、忘れられない愛情 <br>
            気持ちを<ruby>語<rt>かた</rt></ruby>る言葉、 <br>
            クリームのように<ruby>滑<rt>なめ</rt></ruby>らか。 <br>
            分け合ってね。 <br>
          </p>

        </blockquote>
