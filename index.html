<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111113">
  <meta name="description" content="Zaaerの日本語学習ポートフォリオ「器用な世界」。日本語、ものづくり、そして大学生活の記録。">
  <title>器用な世界 — Zaaerの日本語ポートフォリオ</title>
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" defer></script>
</head>

<body data-root="./" data-page="home">
  <a class="skip-link" href="#main">本文へ</a>
  <div id="site-header"></div>
  <main id="main">
    <section class="hero section-wrap" aria-labelledby="hero-title">

      <div class="hero-copy">

        <p class="eyebrow"><span class="eyebrow-line"></span> JAPANESE LANGUAGE PORTFOLIO <span class="eyebrow-index">/
            2026</span></p>
        <p class="hero-subtitle">ようこそ、</p>
        <h1 id="hero-title">器用な<span class="hero-last">世界へ<span class="hero-punctuation">。</span></span></h1>
        <p class="hero-subtitle">手でうまくなりましょう！</p>
        <p class="hero-description">私はザイヤ・イクバルです。<br>これは、私の日本語学習と好きなことを集めた場所です。</p>

        <!-- 
        Unnecessary Buttons 

        <div class="hero-actions">
          <a class="button button-primary" href="#works">作品を見る <span aria-hidden="true">↗</span></a>
          <a class="button button-ghost" href="pages/about.html">自己紹介 <span aria-hidden="true">→</span></a>
        </div>
        -->

      </div>


      <div class="hero-art">
        <img class="hero-photo" src="assets/images/legcrane.jpg" alt="一枚の紙で折った足のあるツル">
        <div class="art-bottomline">
          <span>一枚の紙で折った足のあるツル</span>
        </div>
      </div>


    </section>


    <section class="intro-band" aria-label="Site introduction">
      <div class="section-wrap intro-inner">
        <div class="section-heading">
          <div>
            <p class="toc-kicker">目次 <span>/ TABLE OF CONTENTS</span></p>
            <h2 id="works-title">作品 <span class="heading-mark">&</span> 記録</h2>
          </div>
        </div>
      </div>
    </section>



    <section class="section-wrap section-pad" id="works" aria-labelledby="works-title">

      <!-- The filters and the animation control share one toolbar. -->
      <div class="toc-toolbar">
        <div class="filters" role="group" aria-label="作品を絞り込む">
          <button type="button" class="filter-button" data-filter="all" aria-pressed="false">すべて
            <span>All</span></button>
          <button type="button" class="filter-button" data-filter="course" aria-pressed="false">授業の作品
            <span>Class</span></button>
          <button type="button" class="filter-button" data-filter="highlights" aria-pressed="false">特別な経験
            <span>Highlights</span></button>
          <button type="button" class="filter-button" data-filter="personal" aria-pressed="false">私について
            <span>About</span></button>
        </div>

        <!-- This button is visible only while the cards are moving. -->
        <div class="marquee-controls" id="marquee-controls">
          <button type="button" class="marquee-pause" id="marquee-pause" aria-pressed="false" aria-label="カードの動きを一時停止">Ⅱ
            <span>一時停止</span></button>
        </div>

        <!-- Any selected filter replaces Pause with a way back to the moving view. -->
        <button type="button" class="marquee-pause" id="marquee-return" hidden>↺ <span>流れる表示</span></button>
      </div>
      <div class="works-marquee" id="works-marquee" aria-label="自動で流れる作品一覧">
        <div class="works-marquee-track" id="works-marquee-track"></div>
      </div>
      <!-- Clicking any filter reveals this stationary grid in the original numbered order. -->
      <div class="works-grid" id="works-grid" hidden><!-- Cards are generated from WORKS in site.js. --></div>
    </section>
  </main>
  <div id="site-footer"></div>

</body>

</html>
